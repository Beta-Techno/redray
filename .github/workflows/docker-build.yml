name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        
      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/beta-techno/redray:latest \
            -t ghcr.io/beta-techno/redray:${{ github.sha }} \
            . 2>&1 | tee build.log
          
      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7
          
      - name: Push Docker Image
        if: success()
        run: |
          docker push ghcr.io/beta-techno/redray:latest
          docker push ghcr.io/beta-techno/redray:${{ github.sha }}
